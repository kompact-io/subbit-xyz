[package]
name = "subbit-examples-echo-proxy"
description.workspace = true
documentation.workspace = true
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "echo-proxy"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
clap.workspace = true
http = { workspace = true, optional = true }
include_dir.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
pingora = { version = "0.8", features = ["openssl", "proxy"] }
serde = { workspace = true }
toml = { workspace = true }
subbit-gate-client = { workspace = true, optional = true }
subbit-config = { workspace = true, features = ["clap"] }
subbit-l2-dto = { workspace = true, default-features = false, optional = true }

[features]
default = ["subbit"]                                                 # nothing interesting happens without subbit.
subbit = ["dep:subbit-gate-client", "dep:http", "dep:subbit-l2-dto"]
