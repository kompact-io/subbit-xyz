name: CI
on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - "**.md"
      - "docs/**"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHIX_CACHE: subbit-xyz

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - uses: cachix/cachix-action@v14
        with:
          name: ${{ env.CACHIX_CACHE }}
      - uses: DeterminateSystems/magic-nix-cache-action@v8
        # FIXME: all systems once aiken is fixed
      - run: nix flake check --system x86_64-linux

  list-packages:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - id: list
        run: |
          echo "packages=$(nix eval --json '.#packages.x86_64-linux' --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"

  packages:
    needs: list-packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.list-packages.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - uses: cachix/cachix-action@v14
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: "${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}"
        # FIXME: all systems once aiken is fixed
      - name: build package
        run: |
          mkdir -p out
          store_path=$(nix build ".#packages.x86_64-linux.${{ matrix.package }}" -L --no-link --json | nix run nixpkgs#jq -- -r '.[0].outputs.out // empty')
          if [ -z "$store_path" ]; then
            echo "::warning::${{ matrix.package }} has no binaries - skipping"
          elif [ -d "$store_path" ]; then
            cp -rL "$store_path/." out/
          else
            cp -L "$store_path" "out/${{ matrix.package }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: subbit-xyz-${{ matrix.package }}
          path: out/
          if-no-files-found: warn

  merge-artifacts:
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: subbit-xyz-packages
          pattern: subbit-xyz-*
          delete-merged: true
