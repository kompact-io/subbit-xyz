[toolchain]
# Matches `kompact-io/amaru`'s own pin (its `rust-toolchain.toml`) --
# `amaru-kernel` (pulled in transitively via `floe-client`, and
# directly for `amaru-uplc`/`amaru-plutus`) needs Polonius-era
# borrowck behavior that stable doesn't have yet.
channel = "nightly-2026-09-04"
targets = [
  # # iOS
  # "aarch64-apple-ios",
  # "x86_64-apple-ios",
  # "aarch64-apple-ios-sim",

  # # Android
  # "armv7-linux-androideabi",
  # "i686-linux-android",
  # "aarch64-linux-android",
  # "x86_64-linux-android",
  "x86_64-unknown-linux-gnu",
  # "x86_64-apple-darwin",
  # "aarch64-apple-darwin",
  # "x86_64-pc-windows-gnu",
  # "x86_64-pc-windows-msvc",

  # # WebAssembly
  "wasm32-unknown-unknown",
]
components = ["clippy", "rustfmt", "rust-analyzer", "rust-src"]
