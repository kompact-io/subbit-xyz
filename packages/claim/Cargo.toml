[package]
name = "subbit-claim"
description.workspace = true
documentation.workspace = true
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "subbit_claim"
path = "src/lib.rs"

[[bin]]
name = "subbit-claim"
path = "src/main.rs"

[dependencies]
amaru-kernel.workspace = true
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
hex.workspace = true
minicbor = { workspace = true, features = ["alloc", "derive"] }
minicbor_old = { package = "minicbor", version = "0.25" }
reqwest.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

subbit-config = { workspace = true, features = ["clap"] }
subbit-core = { workspace = true }
subbit-index-dto = { workspace = true }
subbit-l1-dto = { workspace = true }
subbit-tx = { workspace = true, features = ["serde"] }
cardano-sdk.workspace = true
floe-client = { workspace = true, default-features = false, features = [
  "grpc",
] }
floe-dto-http.workspace = true

[build-dependencies]
subbit-build-info.workspace = true
