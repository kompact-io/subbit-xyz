[package]
name = "subbit-claim"
description.workspace = true
documentation.workspace = true
version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "subbit_claim"
path = "src/lib.rs"

[[bin]]
name = "subbit-claim"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
minicbor = { workspace = true, features = ["alloc", "derive"] }
reqwest.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

subbit-config = { workspace = true, features = ["clap"] }
subbit-core = { workspace = true }
subbit-l1-dto = { workspace = true }
subbit-session = { workspace = true, features = ["serde"] }
subbit-tx = { workspace = true, features = ["serde"] }
cardano-sdk.workspace = true
cardano-connector.workspace = true
cardano-connector-direct.workspace = true
cardano-wallet.workspace = true

[build-dependencies]
subbit-build-info.workspace = true
