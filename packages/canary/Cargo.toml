[package]
name = "subbit-canary"
description.workspace = true
documentation.workspace = true
version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "canary"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
blake3.workspace = true
clap = { workspace = true, features = ["derive"] }
cryptoxide.workspace = true
ed25519-dalek = { workspace = true, default-features = false, features = [
  "rand_core",
] }
hex.workspace = true
http.workspace = true
minicbor = { workspace = true, features = ["alloc"] }
rand.workspace = true
reqwest.workspace = true
reqwest-middleware.workspace = true
serde.workspace = true
tempfile = "3"
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "process",
  "time",
] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

amaru-uplc.workspace = true
amaru-plutus.workspace = true
amaru-kernel.workspace = true

cardano-connector.workspace = true
cardano-connector-direct.workspace = true
cardano-sdk = { workspace = true, features = ["serde"] }
cardano-wallet.workspace = true
cardano-session.workspace = true

subbit-claim = { workspace = true }
subbit-core = { workspace = true, features = ["serde"] }
subbit-index = { workspace = true }
subbit-issuer = { workspace = true, features = [
  "reqwest",
  "local",
  "vanilla",
  "x402",
] }
subbit-l1-dto = { workspace = true, features = ["serde"] }
subbit-l2-dto = { workspace = true, features = ["vanilla", "x402", "serde"] }
subbit-server = { workspace = true, features = ["main", "vanilla", "x402"] }
subbit-session = { workspace = true, features = ["serde"] }
subbit-tx = { workspace = true, features = ["serde"] }
