[package]
name = "subbit-canary"
description.workspace = true
documentation.workspace = true
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "canary"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
blake3.workspace = true
clap = { workspace = true, features = ["derive"] }
ed25519-dalek = { workspace = true, default-features = false, features = [
  "rand_core",
] }
hex.workspace = true
rand.workspace = true
reqwest.workspace = true
reqwest-middleware.workspace = true
serde.workspace = true
tempfile = "3"
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "process",
  "time",
] }
toml.workspace = true
tracing-subscriber.workspace = true

cardano-sdk = { workspace = true, features = ["serde"] }
floe-client = { workspace = true, default-features = false, features = [
  "grpc",
] }
subbit-claim = { workspace = true }
subbit-config = { workspace = true, features = ["clap"] }
subbit-console = { workspace = true, default-features = false, features = [
  "admin",
] }
subbit-core = { workspace = true, features = ["serde"] }
subbit-index = { workspace = true, features = ["native"] }
subbit-wallet = { workspace = true, default-features = false }
subbit-stamp = { workspace = true, features = [
  "reqwest",
  "local",
  "vanilla",
  "x402",
] }
subbit-l1-dto = { workspace = true, features = ["serde"] }
subbit-l2-dto = { workspace = true, features = ["vanilla", "x402", "serde"] }
subbit-gate = { workspace = true, features = ["main", "vanilla", "x402"] }
subbit-tx = { workspace = true, features = ["serde"] }

[dev-dependencies]
subbit-cost = { workspace = true }
