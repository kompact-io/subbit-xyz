reqwest-middleware.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio.workspace = true
toml.workspace = true
url.workspace = true

subbit-core = { workspace = true, features = ["serde"] }
subbit-l2-dto = { workspace = true, features = ["vanilla", "x402"] }
