[package]
name = "subbit-issuer"
description.workspace = true
documentation.workspace = true
version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "subbit-issuer"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
subbit-core = { workspace = true, features = ["serde"] }
subbit-l2-dto = { workspace = true, default-features = false }
ed25519-dalek = { workspace = true, default-features = false, features = [
  "rand_core",
] }
thiserror = { workspace = true, default-features = false }
hex.workspace = true
matchit.workspace = true
serde.workspace = true
minicbor = { workspace = true }
web-time.workspace = true # wasm-ready

# cli-only (test client, not the wasm-embedded path)
clap = { workspace = true, features = ["derive"], optional = true }
toml = { workspace = true, optional = true }
subbit-config = { workspace = true, optional = true, features = ["clap"] }

# x402: JSON + standard base64, independent of the cli feature above
base64 = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# reqwest
reqwest = { workspace = true, optional = true }
http = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
reqwest-middleware = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }

[features]
default = ["cli", "reqwest", "vanilla", "x402"]
cli = [
  "dep:clap",
  "dep:toml",
  "dep:subbit-config",
  "dep:serde_json",
  "native_url_lookup",
]
native_url_lookup = ["vanilla"]
reqwest = [
  "dep:reqwest",
  "dep:http",
  "dep:async-trait",
  "dep:reqwest-middleware",
  "dep:anyhow",
]
# Inherit dialect support straight from `subbit-l2-dto`: the features
# have the same names and the same meaning here as there, on purpose
# (see `subbit-server`'s/`subbit-client`'s own `vanilla`/`x402`
# features).
vanilla = ["subbit-l2-dto/vanilla", "subbit-l2-dto/serde"]
x402 = ["subbit-l2-dto/x402", "dep:base64", "dep:serde_json"]

[build-dependencies]
subbit-build-info.workspace = true
