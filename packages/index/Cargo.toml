[package]
name = "subbit-index"
description.workspace = true
documentation.workspace = true
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "subbit_index"
path = "src/lib.rs"

[[bin]]
name = "mock-index"
path = "src/bin/mock.rs"
required-features = ["native"]

# DEPRECATE?
[[bin]]
name = "naive-index"
path = "src/bin/naive.rs"
required-features = ["native"]

[[bin]]
name = "lineage-index"
path = "src/bin/lineage.rs"
required-features = ["native"]

[features]
default = ["native"]
grpc = ["floe-client/grpc"]
native = [
  "grpc",
  "dep:tokio",
  "dep:reqwest",
  "dep:clap",
  "dep:tracing-subscriber",
  "dep:csv",
  "dep:subbit-config",
]

[dependencies]
amaru-kernel.workspace = true
anyhow.workspace = true
clap = { workspace = true, optional = true }
tokio = { workspace = true, features = [
  "time",
  "rt-multi-thread",
  "macros",
], optional = true }
reqwest = { workspace = true, optional = true }
minicbor = { workspace = true, features = ["alloc", "derive"] }
hex = { workspace = true, features = ["alloc", "serde"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
csv = { workspace = true, optional = true }
toml.workspace = true
url.workspace = true

subbit-config = { workspace = true, features = ["clap"], optional = true }
subbit-core = { workspace = true, features = ["serde"] }
subbit-l1-dto = { workspace = true, features = ["serde"] }
subbit-tx = { workspace = true, features = ["serde"] }
floe-client = { workspace = true, default-features = false }
floe-dto-http = { workspace = true, features = ["json"] }
subbit-index-dto = { workspace = true, features = ["serde"] }

[build-dependencies]
subbit-build-info.workspace = true
